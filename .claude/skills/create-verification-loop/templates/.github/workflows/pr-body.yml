# The check on a pull request's description: does it fill .github/pull_request_template.md
# (scripts/pr-body.py)? The backstop for the PR hook: it catches a body written in the web UI, by
# someone without the hook, or edited after the PR was opened. Its own workflow, so a description
# edit re-runs this and nothing heavy, and never replaces the code's `gate` status with a run
# that verified nothing. Require both `gate` and `pr body` in branch protection.
#
# CONFIGURE: the branch name; drop setup-python where python3 is on the runner already.
name: PR body

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-body:
    name: pr body
    # No `if:` skipping a title-only edit: a skipped job reads as passed on a required check, so it
    # would hide a red body. The check takes seconds.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Two commits: the trial merge and its first parent, whose difference is what the PR changes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The body through the API, not the event payload, so the newest edit is the one judged.
      - run: python3 -I scripts/pr-body.py --pr "$PR" --base HEAD^1
        env:
          PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
